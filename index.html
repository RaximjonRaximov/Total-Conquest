<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <title>Infinite Tower</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="game" hidden></div>
    <section id="loading-screen" class="screen">
      <!-- Full-screen background art -->
      <div class="bg"></div>
      <div class="bg-vignette"></div>

      <!-- Title banner -->
      <div class="top">
        <img id="banner" class="banner" src="/assets/img/banner.png" alt="Infinite Tower" />
      </div>

      <!-- Bottom loader -->
      <div class="loader">
        <p id="loading-tip" class="loading-tip">Loading...</p>

        <div class="bar-wrap">
          <!-- knight runs along the top of the bar -->
          <div id="knight" class="knight"></div>

          <div class="bar">
            <div id="progress-fill" class="bar-fill"></div>
            <span id="loading-percent" class="bar-label">0%</span>
          </div>
        </div>

        <button id="start-btn" class="start-btn" hidden>START</button>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
