<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1326" />
  <title>Infinite Tower</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Loading screen -->
    <section id="loading-screen" class="screen">
      <div class="loading-content">
        <img id="banner" class="banner" src="/assets/img/banner.svg" alt="Infinite Tower" />
        <p class="tagline">Minorani zabt et — qavat-qavat</p>
      </div>

      <div class="loader">
        <div class="loader-row">
          <span id="loading-tip" class="loading-tip">Yuklanmoqda...</span>
          <span id="loading-percent" class="loading-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <button id="start-btn" class="start-btn" hidden>BOSHLASH</button>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
