<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Total Conquest - Rim Imperiyasi</title>
    <meta name="description" content="Total Conquest - Rim imperiyasi strategiya o'yini">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0a0e17;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            cursor: default;
        }

        canvas { display: block; }

        /* ===== HUD - Yuqori panel ===== */
        #hud-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(15,20,35,0.95) 0%, rgba(15,20,35,0.7) 100%);
            border-bottom: 1px solid rgba(212,175,55,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .hud-logo {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e18f 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .hud-resources {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .resource-icon {
            font-size: 14px;
        }

        .res-locked {
            opacity: 0.3;
            position: relative;
        }

        .res-locked::after {
            content: '🔒';
            font-size: 10px;
            position: absolute;
            top: -4px;
            right: -4px;
        }

        /* ===== HUD - Pastki panel ===== */
        #hud-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: linear-gradient(0deg, rgba(15,20,35,0.95) 0%, rgba(15,20,35,0.7) 100%);
            border-top: 1px solid rgba(212,175,55,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .hud-btn {
            width: 50px; height: 50px;
            border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.4);
            background: linear-gradient(145deg, rgba(30,40,65,0.9), rgba(20,28,50,0.9));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #c0c0c0;
            font-size: 10px;
            font-weight: 600;
            gap: 2px;
        }

        .hud-btn:hover {
            border-color: #d4af37;
            background: linear-gradient(145deg, rgba(50,60,90,0.9), rgba(30,40,65,0.9));
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212,175,55,0.2);
        }

        .hud-btn:active { transform: translateY(0); }
        .hud-btn .btn-icon { font-size: 20px; }

        /* ===== Minimap ===== */
        #minimap-container {
            position: fixed;
            bottom: 80px; right: 12px;
            width: 130px; height: 130px;
            border: 2px solid rgba(212,175,55,0.5);
            border-radius: 8px;
            background: rgba(10,14,23,0.85);
            z-index: 100;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #minimap-canvas { width: 100%; height: 100%; }

        .minimap-label {
            position: absolute;
            top: 4px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 8px;
            font-weight: 700;
            color: rgba(212,175,55,0.7);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== Level badge ===== */
        .level-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-shield {
            width: 32px; height: 32px;
            background: linear-gradient(145deg, #d4af37, #8b6914);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 16px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 8px rgba(212,175,55,0.3);
        }

        .level-info-text {
            font-size: 11px;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .level-xp-bar {
            width: 80px; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .level-xp-fill {
            height: 100%; width: 35%;
            background: linear-gradient(90deg, #d4af37, #f4e18f);
            border-radius: 3px;
        }

        /* ===== Coord display ===== */
        #coord-display {
            position: fixed;
            top: 64px; left: 12px;
            font-size: 11px;
            color: rgba(200,200,200,0.6);
            z-index: 100;
            background: rgba(10,14,23,0.7);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* ===== Town Hall info ===== */
        #th-display {
            position: fixed;
            top: 64px; right: 150px;
            font-size: 11px;
            color: rgba(212,175,55,0.7);
            z-index: 100;
            background: rgba(10,14,23,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Cinzel', serif;
        }

        /* ===== Loading screen ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, #1a1f35 0%, #0a0e17 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-title {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 42px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e18f 30%, #d4af37 60%, #f4e18f 100%);
            background-size: 200% 200%;
            animation: goldShimmer 3s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .loading-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: rgba(212,175,55,0.6);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .loading-bar-container {
            width: 300px; height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .loading-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #d4af37, #f4e18f);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .loading-text {
            font-size: 12px;
            color: rgba(200,200,200,0.5);
            letter-spacing: 1px;
        }

        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-title">TOTAL CONQUEST</div>
        <div class="loading-subtitle">Rim Imperiyasi</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Xarita yuklanmoqda...</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Top -->
    <div id="hud-top">
        <div class="level-badge">
            <div class="level-shield" id="player-level">1</div>
            <div>
                <div class="level-info-text">LEGATUS</div>
                <div class="level-xp-bar"><div class="level-xp-fill"></div></div>
            </div>
        </div>
        <div class="hud-logo">TOTAL CONQUEST</div>
        <div class="hud-resources">
            <div class="resource-item" id="res-gold-box">
                <span class="resource-icon">🪙</span>
                <span id="res-gold">1000</span>
            </div>
            <div class="resource-item" id="res-food-box">
                <span class="resource-icon">🍎</span>
                <span id="res-food">500</span>
            </div>
            <div class="resource-item" id="res-diamond-box">
                <span class="resource-icon">💎</span>
                <span id="res-diamond">50</span>
            </div>
            <div class="resource-item res-locked" id="res-golden-apple-box" title="Town Hall 7da ochiladi">
                <span class="resource-icon">🍏</span>
                <span id="res-golden-apple">0</span>
            </div>
        </div>
    </div>

    <!-- Coord display -->
    <div id="coord-display">Tile: -</div>
    <div id="th-display">Town Hall: Lvl 1</div>

    <!-- Minimap -->
    <div id="minimap-container">
        <span class="minimap-label">XARITA</span>
        <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- HUD Bottom -->
    <div id="hud-bottom">
        <div class="hud-btn" id="btn-build">
            <span class="btn-icon">🏛️</span>
            <span>Qurish</span>
        </div>
        <div class="hud-btn" id="btn-army">
            <span class="btn-icon">⚔️</span>
            <span>Askar</span>
        </div>
        <div class="hud-btn" id="btn-research">
            <span class="btn-icon">📜</span>
            <span>Ilm</span>
        </div>
        <div class="hud-btn" id="btn-alliance">
            <span class="btn-icon">🤝</span>
            <span>Ittifoq</span>
        </div>
        <div class="hud-btn" id="btn-battle">
            <span class="btn-icon">🏹</span>
            <span>Jang</span>
        </div>
        <div class="hud-btn" id="btn-shop">
            <span class="btn-icon">💎</span>
            <span>Do'kon</span>
        </div>
        <div class="hud-btn" id="btn-settings">
            <span class="btn-icon">⚙️</span>
            <span>Sozlama</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
