<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0a1326"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset="0.5" stop-color="#f4c64b"/>
      <stop offset="1" stop-color="#c98a1e"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7794"/>
      <stop offset="1" stop-color="#39435e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="450" cy="220" r="260" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#dfe8ff" opacity="0.8">
    <circle cx="120" cy="70" r="2"/><circle cx="220" cy="120" r="1.5"/>
    <circle cx="760" cy="90" r="2"/><circle cx="680" cy="160" r="1.5"/>
    <circle cx="820" cy="200" r="1.5"/><circle cx="80" cy="200" r="1.5"/>
    <circle cx="500" cy="60" r="1.5"/><circle cx="380" cy="90" r="1.5"/>
  </g>

  <!-- tower -->
  <g transform="translate(450,150)">
    <!-- base levels (infinite tower) -->
    <rect x="-90" y="230" width="180" height="40" rx="6" fill="url(#stone)"/>
    <rect x="-78" y="186" width="156" height="46" rx="6" fill="url(#stone)"/>
    <rect x="-66" y="140" width="132" height="48" rx="6" fill="url(#stone)"/>
    <rect x="-54" y="92"  width="108" height="50" rx="6" fill="url(#stone)"/>
    <rect x="-42" y="44"  width="84"  height="50" rx="6" fill="url(#stone)"/>
    <!-- crenellations -->
    <g fill="url(#stone)">
      <rect x="-40" y="28" width="16" height="18"/>
      <rect x="-12" y="28" width="16" height="18"/>
      <rect x="16"  y="28" width="16" height="18"/>
    </g>
    <!-- windows -->
    <g fill="#ffcf6b">
      <rect x="-8" y="58"  width="16" height="22" rx="4"/>
      <rect x="-8" y="106" width="16" height="22" rx="4"/>
      <rect x="-8" y="154" width="16" height="24" rx="4"/>
    </g>
    <!-- banner flag -->
    <rect x="-2" y="-26" width="4" height="56" fill="#caa24a"/>
    <path d="M2 -22 L46 -12 L2 -2 Z" fill="url(#gold)"/>
  </g>

  <!-- title -->
  <text x="450" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="74" font-weight="900" fill="url(#gold)" stroke="#5a3c0c" stroke-width="2"
        letter-spacing="3">INFINITE</text>
  <text x="450" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="900" fill="#eaf1ff" stroke="#22304f" stroke-width="2"
        letter-spacing="14">TOWER</text>
</svg>
